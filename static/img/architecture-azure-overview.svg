<title id="title">ERPBridge — Proposed Azure Deployment (Overview)</title>
<desc id="desc">Left to right: Local Developer (bridgectl) and Business Users connect via Workflow Frontend and Backend/Agent to Fine-Tuned Model brain, then via MCP Tool Gateway to Azure VNet ERPBridge/MockERP, Vector DB and RAG. Legend distinguishes user, MCP, private VNet, dev secure.</desc>
