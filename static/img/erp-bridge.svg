<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated illustration: ERPBridge connects a legacy ERP system to AI agents over MCP without changing legacy code">
  <title>ERPBridge — bridge legacy ERP to AI agents over MCP</title>
  <desc>Legacy ERP on the left stays untouched while a glowing MCP bridge carries data packets to a pulsing AI neural cluster running 24/7 automated workflows.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#25c2a0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#25c2a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="erpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b64c"/>
      <stop offset="1" stop-color="#b07c26"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25c2a0"/>
      <stop offset="1" stop-color="#147d66"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="0.5" stop-color="#25c2a0"/>
      <stop offset="1" stop-color="#7df3e0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="320" cy="215" rx="280" ry="170" fill="url(#bgGlow)"/>
  <ellipse cx="320" cy="120" rx="140" ry="80" fill="#7df3e0" opacity="0.10" filter="url(#bigGlow)"/>

  <!-- floating background particles -->
  <g fill="#7df3e0">
    <circle cx="190" cy="300" r="2.5">
      <animate attributeName="cy" values="300;255;300" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="330" r="2">
      <animate attributeName="cy" values="330;285;330" dur="7s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="315" r="2.5">
      <animate attributeName="cy" values="315;265;315" dur="6.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="6.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="310" r="2">
      <animate attributeName="cy" values="310;260;310" dur="7.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="7.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#f0c674">
    <circle cx="360" cy="350" r="2">
      <animate attributeName="cy" values="350;300;350" dur="8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="8s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="345" r="2">
      <animate attributeName="cy" values="345;295;345" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= LEGACY ERP (left) ================= -->
  <g id="erp-side">
    <!-- protective halo (rotating dashed ring) -->
    <circle cx="95" cy="185" r="92" fill="none" stroke="#f0c674" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="7 9" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 95 185" to="360 95 185" dur="48s" repeatCount="indefinite"/>
    </circle>
    <!-- lock glyph on the halo -->
    <g transform="translate(95,83)">
      <rect x="-9" y="-6" width="18" height="14" rx="3" fill="#f0c674"/>
      <path d="M-6 -6 V-11 a6 6 0 0 1 12 0 V-6" fill="none" stroke="#f0c674" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- paper documents (floating stack) -->
    <g>
      <rect x="36" y="98" width="46" height="10" rx="3" fill="#fff8e7"/>
      <rect x="40" y="92" width="46" height="10" rx="3" fill="#fff1cf"/>
      <rect x="38" y="86" width="46" height="10" rx="3" fill="#ffffff">
        <animate attributeName="y" values="86;85;86" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- server tower -->
    <g id="tower">
      <rect x="50" y="120" width="90" height="118" rx="12" fill="url(#erpGrad)" stroke="#8a6420" stroke-width="2"/>
      <rect x="60" y="128" width="70" height="26" rx="6" fill="#3b2c10" opacity="0.9"/>
      <text x="95" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0c674">LEGACY ERP</text>
      <rect x="60" y="168" width="70" height="12" rx="6" fill="#3b2c10" opacity="0.55"/>
      <rect x="60" y="188" width="70" height="12" rx="6" fill="#3b2c10" opacity="0.55"/>
      <rect x="60" y="208" width="70" height="12" rx="6" fill="#3b2c10" opacity="0.55"/>
      <!-- blinking status lights -->
      <circle cx="134" cy="174" r="3.5" fill="#7df3e0">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="134" cy="194" r="3.5" fill="#7df3e0">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="134" cy="214" r="3.5" fill="#7df3e0">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- power LED -->
      <circle cx="60" cy="124" r="4" fill="#f0c674">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- rotating gears -->
    <g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 118 248" to="360 118 248" dur="12s" repeatCount="indefinite"/>
        <circle cx="118" cy="248" r="15" fill="none" stroke="#b07c26" stroke-width="6" stroke-dasharray="4.5 4.5" stroke-linecap="round"/>
        <circle cx="118" cy="248" r="11" fill="#8a6420" stroke="#5d4312" stroke-width="1.5"/>
        <circle cx="118" cy="248" r="4" fill="#3b2c10"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 84 260" to="-360 84 260" dur="9s" repeatCount="indefinite"/>
        <circle cx="84" cy="260" r="11" fill="none" stroke="#b07c26" stroke-width="5" stroke-dasharray="3.5 3.5" stroke-linecap="round"/>
        <circle cx="84" cy="260" r="8" fill="#8a6420" stroke="#5d4312" stroke-width="1.5"/>
        <circle cx="84" cy="260" r="3" fill="#3b2c10"/>
      </g>
    </g>

    <!-- badge: zero code changes -->
    <g transform="translate(95, 318)">
      <rect x="-58" y="-13" width="116" height="26" rx="13" fill="#3b2c10" opacity="0.9" stroke="#f0c674" stroke-width="1.5"/>
      <rect x="-44" y="-5" width="8" height="7" rx="1.5" fill="#f0c674"/>
      <path d="M-42 -5 V-8 a4 4 0 0 1 8 0 V-5" fill="none" stroke="#f0c674" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">0 code changes</text>
    </g>
  </g>

  <!-- ================= THE BRIDGE (center) ================= -->
  <g id="bridge">
    <!-- bridge beam -->
    <path d="M145 210 Q320 42 475 210" fill="none" stroke="url(#bridgeGrad)" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
    <path d="M145 210 Q320 42 475 210" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.22"/>

    <!-- animated energy flow along the bridge -->
    <path d="M145 210 Q320 42 475 210" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 22" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-190" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- data packets travelling ERP -> AI -->
    <g>
      <circle cx="0" cy="0" r="7" fill="#ffd166" stroke="#fff8e7" stroke-width="2">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M145 210 Q320 42 475 210"/>
      </circle>
      <circle cx="0" cy="0" r="5" fill="#7df3e0" stroke="#ffffff" stroke-width="2">
        <animateMotion dur="3.2s" begin="1.05s" repeatCount="indefinite" path="M145 210 Q320 42 475 210"/>
      </circle>
      <circle cx="0" cy="0" r="5" fill="#f78c6c" stroke="#ffffff" stroke-width="2">
        <animateMotion dur="3.2s" begin="2.1s" repeatCount="indefinite" path="M145 210 Q320 42 475 210"/>
      </circle>
    </g>

    <!-- MCP hub with orbiting rings -->
    <g id="mcp-hub">
      <circle cx="320" cy="138" r="30" fill="#ffffff" stroke="#2e8555" stroke-width="5" filter="url(#softGlow)"/>
      <text x="320" y="143" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e8555">MCP</text>

      <!-- orbit ring 1 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 320 138" to="360 320 138" dur="9s" repeatCount="indefinite"/>
        <ellipse cx="320" cy="138" rx="44" ry="14" fill="none" stroke="#7df3e0" stroke-width="2" opacity="0.7"/>
        <circle cx="364" cy="138" r="4" fill="#25c2a0"/>
      </g>
      <!-- orbit ring 2 (counter-rotating) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 320 138" to="360 320 138" dur="7s" repeatCount="indefinite"/>
        <ellipse cx="320" cy="138" rx="14" ry="44" fill="none" stroke="#f0c674" stroke-width="2" opacity="0.7"/>
        <circle cx="320" cy="94" r="4" fill="#f0c674"/>
      </g>
      <!-- expanding pulse ring -->
      <circle cx="320" cy="138" r="34" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5">
        <animate attributeName="r" values="30;46;30" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- middleware pills along the bridge -->
    <g font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">
      <g transform="translate(238,124)">
        <rect x="-24" y="-11" width="48" height="22" rx="11" fill="#2e8555" opacity="0.92" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle">cache</text>
      </g>
      <g transform="translate(320,66)">
        <rect x="-30" y="-11" width="60" height="22" rx="11" fill="#2e8555" opacity="0.92" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle">rate-limit</text>
      </g>
      <g transform="translate(402,124)">
        <rect x="-24" y="-11" width="48" height="22" rx="11" fill="#2e8555" opacity="0.92" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle">route</text>
      </g>
    </g>
  </g>

  <!-- ================= MODERN AI (right) ================= -->
  <g id="ai-side">
    <rect x="478" y="100" width="138" height="176" rx="16" fill="url(#aiGrad)" stroke="#0f5c4a" stroke-width="2"/>
    <text x="547" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">AI AGENTS</text>

    <!-- neural connections -->
    <path d="M505 145 L555 132 M555 132 L595 150 M505 145 L528 190 M555 132 L580 195 M595 150 L580 195 M528 190 L580 195" stroke="#7df3e0" stroke-width="1.5" opacity="0.55" fill="none"/>

    <!-- signal pulses travelling across the network -->
    <g>
      <circle cx="0" cy="0" r="3" fill="#ffffff">
        <animateMotion dur="2.5s" repeatCount="indefinite" path="M505 145 L555 132"/>
      </circle>
      <circle cx="0" cy="0" r="3" fill="#ffd166">
        <animateMotion dur="2.5s" begin="0.6s" repeatCount="indefinite" path="M555 132 L580 195"/>
      </circle>
      <circle cx="0" cy="0" r="3" fill="#ffffff">
        <animateMotion dur="2.5s" begin="1.2s" repeatCount="indefinite" path="M528 190 L580 195"/>
      </circle>
      <circle cx="0" cy="0" r="3" fill="#ffffff">
        <animateMotion dur="2.5s" begin="1.8s" repeatCount="indefinite" path="M555 132 L595 150"/>
      </circle>
    </g>

    <!-- neuron nodes -->
    <circle cx="505" cy="145" r="7" fill="#ffffff"/>
    <circle cx="555" cy="132" r="8" fill="#ffffff"/>
    <circle cx="595" cy="150" r="7" fill="#ffffff"/>
    <circle cx="528" cy="190" r="7" fill="#ffffff"/>
    <circle cx="580" cy="195" r="7" fill="#ffffff"/>

    <!-- pulsing halo around central node -->
    <circle cx="555" cy="132" r="13" fill="none" stroke="#7df3e0" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="10;19;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling sparkles -->
    <path d="M595 116 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3 z" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M496 205 l2.5 5 5 2.5 -5 2.5 -2.5 5 -2.5 -5 -5 -2.5 5 -2.5 z" fill="#ffd166">
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M612 165 l2.5 5 5 2.5 -5 2.5 -2.5 5 -2.5 -5 -5 -2.5 5 -2.5 z" fill="#7df3e0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </path>

    <!-- 24/7 clock -->
    <g transform="translate(547,238)">
      <circle r="17" fill="#ffffff" opacity="0.15"/>
      <circle r="17" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="2.5 4.5" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2.5s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="7" y2="0" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff">24/7</text>
    </g>

    <!-- automation loop arrow -->
    <g transform="translate(610,112)">
      <path d="M0 0 a9 9 0 1 1 11 7" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
      <path d="M10 10 l-3 -4 5 1 z" fill="#ffd166"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff">
        <animateMotion dur="3.5s" repeatCount="indefinite" path="M0 0 a9 9 0 1 1 11 7"/>
      </circle>
    </g>

    <!-- label below the panel -->
    <text x="547" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" opacity="0.95">always-on workflows</text>
  </g>
</svg>