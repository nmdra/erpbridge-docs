<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated illustration: raw ERP data flows into the ERPBridge hub and comes out transformed for AI agents">
  <title>ERPBridge — raw ERP data in, AI-ready data out</title>
  <desc>Gold packets leave the legacy ERP, pass through the ERPBridge hub where they are transformed into structured teal packets, and arrive at the AI agent.</desc>

  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7df3e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ambient glow behind the hub -->
  <circle cx="320" cy="138" r="120" fill="url(#glow)"/>

  <!-- ============ LEGACY ERP (left, gold accent) ============ -->
  <g id="erp">
    <rect x="66" y="138" width="92" height="124" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="82" y="158" width="60" height="10" rx="5" fill="#ffd166" fill-opacity="0.85"/>
    <rect x="82" y="178" width="60" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="82" y="198" width="60" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="140" cy="230" r="5" fill="#ffd166">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="246" r="5" fill="#ffd166" fill-opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- raw packets leaving the ERP (gold dots) -->
  <g fill="#ffd166" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5">
    <circle r="5">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M 158 200 Q 240 168 320 138"/>
    </circle>
    <circle r="5">
      <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M 158 200 Q 240 168 320 138"/>
    </circle>
    <circle r="5">
      <animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" path="M 158 200 Q 240 168 320 138"/>
    </circle>
  </g>

  <!-- ============ THE BRIDGE (center, data transformation) ============ -->
  <g id="bridge">
    <!-- beam: gold (left) fades to white then teal (right) = transformation -->
    <path d="M158 200 Q 320 60 482 200" fill="none" stroke="url(#beam)" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
    <path d="M158 200 Q 320 60 482 200" fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>

    <!-- energy flowing along the beam -->
    <path d="M158 200 Q 320 60 482 200" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="10 20" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- transformation hub at the apex: two chevrons = convert -->
    <g id="hub">
      <circle cx="320" cy="138" r="26" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M310 130 l8 8 -8 8 M330 130 l8 8 -8 8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="320" cy="138" r="32" fill="none" stroke="#7df3e0" stroke-opacity="0.8" stroke-width="2">
        <animate attributeName="r" values="26;40;26" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- transformed packets leaving the hub (teal squares with check) -->
    <g fill="#7df3e0" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.5">
      <rect x="-5" y="-5" width="10" height="10" rx="2.5">
        <animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M 320 138 Q 400 168 482 200"/>
        <animate attributeName="fill-opacity" values="1;1;1" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-5" y="-5" width="10" height="10" rx="2.5">
        <animateMotion dur="2.6s" begin="1.4s" repeatCount="indefinite" path="M 320 138 Q 400 168 482 200"/>
      </rect>
      <rect x="-5" y="-5" width="10" height="10" rx="2.5">
        <animateMotion dur="2.6s" begin="2.3s" repeatCount="indefinite" path="M 320 138 Q 400 168 482 200"/>
      </rect>
    </g>
  </g>

  <!-- ============ AI AGENT (right, teal accent) ============ -->
  <g id="ai">
    <rect x="482" y="138" width="92" height="124" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
    <!-- sparkle -->
    <path d="M528 164 l5 10 10 5 -10 5 -5 10 -5 -10 -10 -5 10 -5 z" fill="#7df3e0">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- node cluster: small agents -->
    <circle cx="548" cy="212" r="7" fill="#ffffff" fill-opacity="0.85">
      <animate attributeName="r" values="7;9;7" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="232" r="5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="562" cy="234" r="5" fill="#ffffff" fill-opacity="0.5"/>
    <path d="M548 212 L530 232 M548 212 L562 234" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
</svg>