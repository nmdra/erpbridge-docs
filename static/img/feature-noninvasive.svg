<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="niGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25c2a0"/>
      <stop offset="1" stop-color="#2e8555"/>
    </linearGradient>
  </defs>

  <!-- "No code changes" symbol: circle with slash (replaces fragile <text>) -->
  <g transform="translate(40 36)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#niGrad)" stroke-width="4"/>
    <path d="M-11 11 L11 -11" stroke="url(#niGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Legacy ERP box (untouched) -->
  <rect x="28" y="82" width="84" height="72" rx="12" fill="currentColor" opacity="0.22"/>
  <rect x="42" y="100" width="56" height="14" rx="6" fill="currentColor" opacity="0.55"/>
  <rect x="42" y="122" width="40" height="8" rx="4" fill="currentColor" opacity="0.4"/>
  <circle cx="50" cy="140" r="5" fill="url(#niGrad)"/>
  <circle cx="66" cy="140" r="5" fill="currentColor" opacity="0.4"/>

  <!-- Dashed boundary: nothing changes inside -->
  <rect x="18" y="72" width="104" height="92" rx="18" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>

  <!-- Plug-in node connecting from outside -->
  <path d="M176 48 Q150 64 126 104" fill="none" stroke="url(#niGrad)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="122" cy="110" r="12" fill="url(#niGrad)"/>
  <path d="M116 110 L128 110 M122 104 L122 116" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
