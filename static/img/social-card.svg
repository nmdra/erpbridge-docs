    <rect x="0" y="0" width="195" height="36" rx="18" fill="url(#accent)" fill-opacity="0.15" stroke="#25c2a0" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="18" cy="18" r="4" fill="#25c2a0"/>
    <text x="32" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#25c2a0">Alpha v0.3.0-alpha.1</text>
