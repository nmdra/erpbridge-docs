  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="75" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#25c2a0" text-anchor="middle">MCP Tools</text>

    <rect x="165" y="0" width="140" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="235" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#25c2a0" text-anchor="middle">Tool Registry</text>

    <rect x="320" y="0" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="385" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#25c2a0" text-anchor="middle">BYOERP</text>

    <rect x="465" y="0" width="155" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
