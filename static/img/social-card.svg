<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1d"/>
      <stop offset="0.5" stop-color="#1f2d26"/>
      <stop offset="1" stop-color="#1b1b1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25c2a0"/>
      <stop offset="1" stop-color="#2e8555"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.4">
      <stop offset="0" stop-color="#25c2a0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#25c2a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.7" r="0.35">
      <stop offset="0" stop-color="#2e8555" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#2e8555" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="44" y1="0" x2="44" y2="630"/>
    <line x1="88" y1="0" x2="88" y2="630"/>
    <line x1="132" y1="0" x2="132" y2="630"/>
    <line x1="0" y1="44" x2="1200" y2="44"/>
    <line x1="0" y1="88" x2="1200" y2="88"/>
    <line x1="0" y1="132" x2="1200" y2="132"/>
    <line x1="0" y1="176" x2="1200" y2="176"/>
  </g>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="454" x2="1200" y2="454"/>
    <line x1="0" y1="498" x2="1200" y2="498"/>
    <line x1="0" y1="542" x2="1200" y2="542"/>
    <line x1="0" y1="586" x2="1200" y2="586"/>
  </g>

  <!-- ERPBridge mark -->
  <g transform="translate(80, 80) scale(0.4)">
    <rect x="12" y="12" width="176" height="176" rx="42" fill="url(#accent)"/>
    <rect x="19" y="19" width="162" height="162" rx="35" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M49 142V66M151 142V66" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
    <path d="M39 124H161" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M49 103C72 65 128 65 151 103" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>
    <path d="M76 79V119M100 72V117M124 79V119" fill="none" stroke="#ffffff" stroke-opacity="0.56" stroke-width="5" stroke-linecap="round"/>
    <rect x="34" y="135" width="30" height="22" rx="7" fill="#ffffff"/>
    <path d="M42 146H56" stroke="#2e8555" stroke-width="4" stroke-linecap="round"/>
    <circle cx="151" cy="146" r="15" fill="#ffffff"/>
    <circle cx="151" cy="146" r="5" fill="#2e8555"/>
  </g>

  <!-- Project name -->
  <text x="180" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="-0.5">ERPBridge</text>
  <text x="180" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#25c2a0">Documentation</text>

  <!-- Hero text -->
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Connect your legacy ERP</text>
  <text x="80" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" fill="url(#accent)" letter-spacing="-1.5">to AI workflows.</text>

